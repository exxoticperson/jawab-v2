<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawab Reel Concept: The Dubai Standard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700&display=swap');
        
        :root {
            --bg-color: #030303;
            --text-color: #FAFAFA;
            --accent-glow: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 9:16 Aspect Ratio Container */
        .phone-frame {
            width: 400px;
            height: 711px; /* Approximation of 9:16 for display */
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px var(--accent-glow);
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-weight: 200;
            font-size: 2.2rem;
            letter-spacing: -1px;
            line-height: 1.2;
            margin: 0;
            transform: translateY(20px);
            opacity: 0;
        }

        .highlight {
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .metric {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-top: 20px;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.3);
        }

        .jawab-logo {
            width: 60px;
            height: 60px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255,255,255,0.05);
        }

        /* Animations */
        @keyframes fadeInMove {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; filter: blur(10px); }
        }
        @keyframes strobe {
            0% { -webkit-text-stroke: 1px rgba(255,255,255,0.3); color: transparent; text-shadow: none; }
            50% { -webkit-text-stroke: 0px; color: #fff; text-shadow: 0 0 40px #fff; }
            100% { -webkit-text-stroke: 1px rgba(255,255,255,0.3); color: transparent; text-shadow: none; }
        }

        /* Scene Sequencing */
        #scene1 { animation: fadeInMove 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.5s, fadeOut 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 3s; }
        #scene1 h1 { animation: fadeInMove 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.8s; }
        
        #scene2 { animation: fadeInMove 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 3.5s, fadeOut 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 6s; }
        #scene2 h1 { animation: fadeInMove 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 3.8s; }
        #scene2 .metric { animation: fadeInMove 1s forwards 4s, strobe 0.5s ease-in-out forwards 4.5s; }

        #scene3 { animation: fadeInMove 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 6.5s; }
        #scene3 .jawab-logo { animation: fadeInMove 1.5s forwards 6.8s; }
        #scene3 h1 { animation: fadeInMove 1.5s forwards 7s; }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 10%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.05), transparent);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="scanline"></div>

        <!-- The Hook: Prestigious, Arrogant, True -->
        <div class="scene" id="scene1">
            <h1>Dubai's top clinics <br>don't wait for <br><span class="highlight">patients.</span></h1>
        </div>

        <!-- The Agitation: Data-driven shock -->
        <div class="scene" id="scene2">
            <h1>Missed calls cost you</h1>
            <div class="metric">$14,200/mo</div>
        </div>

        <!-- The Solution: Minimalist Reveal -->
        <div class="scene" id="scene3">
            <div class="jawab-logo">ج</div>
            <h1><span class="highlight">Jawab</span> recovers them.<br>Silently.</h1>
        </div>
    </div>

</body>
</html>
