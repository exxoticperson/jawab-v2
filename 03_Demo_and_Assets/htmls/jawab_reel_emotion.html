<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jawab Reel | The Empty Chair</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --gold: #D4AF37;
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%; background: #000;
            font-family: 'Inter', sans-serif; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #reel-canvas {
            width: 400px; height: 711px;
            background: var(--bg-dark); position: relative;
            overflow: hidden;
        }

        /* The Cinematic Image Layer */
        .image-container {
            position: absolute; width: 150%; height: 150%;
            top: -25%; left: -25%; z-index: 1;
            /* We use one of the generated images, fallback to a dark gradient if not found */
            background-image: url('../generated_visuals/fb_ad_empty_chair_1777765574404.png'), radial-gradient(circle at center, #222 0%, #000 100%);
            background-size: cover; background-position: center;
            filter: brightness(0.6) contrast(1.2) sepia(0.3) hue-rotate(-10deg);
            opacity: 0; transform: scale(1);
        }

        /* Cinematic Overlays */
        .vignette { position: absolute; width: 100%; height: 100%; top: 0; left: 0; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.95) 100%); z-index: 5; pointer-events: none; }
        .film-grain { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.08"/%3E%3C/svg%3E'); z-index: 6; pointer-events: none; opacity: 0.8; animation: grain 0.5s steps(1) infinite; }
        @keyframes grain { 0%, 100% { transform: translate(0, 0); } 10% { transform: translate(-2%, -2%); } 30% { transform: translate(2%, -2%); } 50% { transform: translate(-2%, 2%); } 70% { transform: translate(2%, 2%); } }
        
        .light-leak { position: absolute; width: 150%; height: 150%; top: -25%; left: -25%; background: radial-gradient(circle at 80% 20%, rgba(212,175,55,0.15) 0%, transparent 50%); z-index: 7; mix-blend-mode: screen; pointer-events: none; opacity: 0; }

        /* Typography (Luxury Editorial Style) */
        .text-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; pointer-events: none; }
        
        .t-serif { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2.2rem; color: #fff; font-weight: 400; line-height: 1.2; opacity: 0; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .t-serif span { color: var(--gold); }
        .t-sans { font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-top: 20px; opacity: 0; }

        /* The Data Interruption */
        .data-glitch { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 15; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; backdrop-filter: blur(10px); }
        .dg-number { font-family: 'Outfit'; font-size: 5rem; font-weight: 200; color: #fff; letter-spacing: -2px; }
        .dg-label { font-size: 1rem; color: var(--gold); letter-spacing: 4px; text-transform: uppercase; margin-top: 10px; }

        /* Jawab Final Reveal */
        .jawab-reveal { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 20; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; }
        .j-svg { width: 180px; filter: drop-shadow(0 0 40px rgba(212,175,55,0.3)); opacity: 0; transform: scale(0.9); }
        .j-tagline { font-family: 'Inter'; font-size: 1rem; font-weight: 300; letter-spacing: 3px; color: #fff; margin-top: 40px; opacity: 0; }

        /* Initializer */
        #play-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: #050505; z-index: 100; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-direction: column; }
        .play-ring { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--gold); display: flex; justify-content: center; align-items: center; transition: all 0.3s; }
        .play-ring:hover { background: rgba(212,175,55,0.1); transform: scale(1.1); box-shadow: 0 0 30px rgba(212,175,55,0.2); }
        .play-ring svg { width: 20px; fill: var(--gold); margin-left: 3px; }
        .play-text { font-family: 'Outfit'; letter-spacing: 4px; font-size: 11px; color: var(--gold); margin-top: 20px; text-transform: uppercase; }

    </style>
</head>
<body>

    <div id="reel-canvas">
        <div class="image-container" id="bg-img"></div>
        <div class="vignette"></div>
        <div class="film-grain"></div>
        <div class="light-leak" id="leak"></div>

        <div class="text-layer">
            <div class="t-serif" id="t1">The most expensive<br>chair in Dubai...</div>
            <div class="t-sans" id="t2">IS AN EMPTY ONE</div>
        </div>

        <div class="text-layer" style="z-index: 12;">
            <div class="t-serif" id="t3">Every <span>missed call</span><br>is a patient lost.</div>
        </div>

        <div class="data-glitch" id="glitch">
            <div class="dg-number" id="g-num">24</div>
            <div class="dg-label">Calls Missed Today</div>
        </div>

        <div class="jawab-reveal" id="jawab">
            <svg class="j-svg" id="j-logo" viewBox="0 0 200 60">
                <g transform="translate(0, 5)"><circle cx="20" cy="25" r="15" fill="none" stroke="#D4AF37" stroke-width="2"/><circle cx="32" cy="25" r="15" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4"/></g>
                <text x="60" y="40" font-family="'Outfit'" font-size="40" font-weight="600" fill="#D4AF37" letter-spacing="1">Jawab</text>
            </svg>
            <div class="j-tagline" id="j-tag">Fill every gap.<br><span style="font-size: 0.7rem; color: #888; display: block; margin-top: 10px;">AUTOMATICALLY.</span></div>
        </div>

        <div id="play-overlay" onclick="startCinematic()">
            <div class="play-ring"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
            <div class="play-text">Initialize Cinematic Concept</div>
        </div>
    </div>

    <script>
        function startCinematic() {
            document.getElementById('play-overlay').style.display = 'none';
            const tl = gsap.timeline();

            // SCENE 1: The Immersive Zoom
            // Mimicking a high-end AI Video generator "Veo" movement
            tl.to("#bg-img", { opacity: 0.8, duration: 2, ease: "power2.inOut" })
              .to("#bg-img", { scale: 1.2, x: "-5%", y: "-2%", duration: 12, ease: "sine.inOut" }, "-=2")
              .to("#leak", { opacity: 1, x: "-20%", y: "10%", duration: 8, ease: "sine.inOut", yoyo: true, repeat: 1 }, "-=12");

            // Text Sequence 1
            tl.to("#t1", { opacity: 1, y: -10, duration: 2, ease: "power2.out" }, "-=10")
              .to("#t2", { opacity: 1, y: -5, duration: 1.5, ease: "power2.out" }, "-=8")
              .to("#t1, #t2", { opacity: 0, filter: "blur(10px)", duration: 1.5 }, "-=5");

            // Text Sequence 2
            tl.to("#t3", { opacity: 1, scale: 1.05, duration: 2, ease: "power2.out" }, "-=3.5")
              .to("#t3", { opacity: 0, duration: 1 }, "-=0.5");

            // SCENE 2: The Data Interruption
            tl.to("#glitch", { opacity: 1, duration: 0.1 })
              .to("#g-num", { scale: 1.2, duration: 0.1, yoyo: true, repeat: 5, ease: "rough" }, "+=0.1");
              
            let calls = { val: 24 };
            tl.to(calls, {
                val: 148, duration: 1.5, ease: "power4.in",
                onUpdate: () => { document.getElementById('g-num').innerText = Math.floor(calls.val); }
            });

            tl.to("#glitch", { opacity: 0, duration: 0.1, delay: 0.2 });

            // SCENE 3: The Jawab Reveal
            tl.to("#jawab", { opacity: 1, duration: 1, ease: "power2.inOut" })
              .to("#j-logo", { opacity: 1, scale: 1, duration: 1.5, ease: "power4.out" })
              .to("#j-tag", { opacity: 1, y: -10, duration: 1, ease: "power2.out" }, "-=0.5");
        }
    </script>
</body>
</html>
