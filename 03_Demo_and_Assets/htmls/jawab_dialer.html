<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawab | Obsidian Dialer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0a0a0a;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --text-main: #f5f5f5;
            --text-dim: #a0a0a0;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(212, 175, 55, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--obsidian);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #1a1a1a, #0a0a0a);
        }

        .dialer-card {
            width: 380px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            text-align: center;
        }

        .header { margin-bottom: 30px; }
        .logo { 
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            letter-spacing: 4px;
            color: var(--gold);
            text-transform: uppercase;
        }
        .subtitle { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }

        .display {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        #number-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            text-align: center;
            outline: none;
        }

        #status { font-size: 11px; color: var(--gold); margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .key {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .key:hover { background: var(--gold); color: var(--obsidian); border-color: var(--gold); }
        .key span { font-size: 8px; color: var(--text-dim); }
        .key:hover span { color: var(--obsidian); }

        .actions { display: flex; gap: 15px; }

        .btn {
            flex: 1;
            padding: 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .call-btn {
            background: var(--gold);
            color: var(--obsidian);
            box-shadow: 0 10px 30px var(--gold-glow);
        }

        .call-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px var(--gold-glow); }

        .hangup-btn {
            background: #ff4d4d;
            color: white;
            display: none;
        }

        .settings-panel {
            margin-top: 30px;
            font-size: 10px;
            color: var(--text-dim);
            text-decoration: underline;
            cursor: pointer;
        }

        #config {
            display: none;
            background: #111;
            padding: 20px;
            border-radius: 20px;
            margin-top: 20px;
            text-align: left;
        }

        input.config-input {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            margin: 5px 0 15px 0;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="dialer-card">
    <div class="header">
        <div class="logo">JAWAB</div>
        <div class="subtitle">PREMIUM CLINIC RECOVERY</div>
    </div>

    <div class="display">
        <input type="text" id="number-input" placeholder="+971 ..." value="+971">
        <div id="status">Ready to Call</div>
    </div>

    <div class="keypad">
        <button class="key" onclick="append('1')">1</button>
        <button class="key" onclick="append('2')">2<span>ABC</span></button>
        <button class="key" onclick="append('3')">3<span>DEF</span></button>
        <button class="key" onclick="append('4')">4<span>GHI</span></button>
        <button class="key" onclick="append('5')">5<span>JKL</span></button>
        <button class="key" onclick="append('6')">6<span>MNO</span></button>
        <button class="key" onclick="append('7')">7<span>PQRS</span></button>
        <button class="key" onclick="append('8')">8<span>TUV</span></button>
        <button class="key" onclick="append('9')">9<span>WXYZ</span></button>
        <button class="key" onclick="append('*')">*</button>
        <button class="key" onclick="append('0')">0</button>
        <button class="key" onclick="backspace()">⌫</button>
    </div>

    <div class="actions">
        <button class="btn call-btn" id="call-btn" onclick="makeCall()">Start Call</button>
        <button class="btn hangup-btn" id="hangup-btn">Hang Up</button>
    </div>

    <div class="settings-panel" onclick="toggleConfig()">Configure Credentials</div>
    
    <div id="config">
        <label>Account SID</label>
        <input type="text" id="sid" class="config-input" placeholder="AC...">
        <label>Auth Token</label>
        <input type="password" id="token" class="config-input" placeholder="Auth Token">
        <label>TwiML Bridge URL</label>
        <input type="text" id="twimlurl" class="config-input" placeholder="https://handler.twilio.com/...">
        <label>Verified UAE Caller ID</label>
        <input type="text" id="callerid" class="config-input" placeholder="+971...">
        <label>Your Receiving Number (to talk)</label>
        <input type="text" id="mynumber" class="config-input" placeholder="+20... or +971...">
        <button class="btn save-btn" onclick="saveSettings()">Save Settings</button>
    </div>
</div>

<script>
    // Load settings on startup
    window.onload = () => {
        const fields = ['sid', 'token', 'twimlurl', 'callerid', 'mynumber'];
        fields.forEach(f => {
            const val = localStorage.getItem('jawab_' + f);
            if (val) document.getElementById(f).value = val;
        });
    };

    function saveSettings() {
        const fields = ['sid', 'token', 'twimlurl', 'callerid', 'mynumber'];
        fields.forEach(f => {
            localStorage.setItem('jawab_' + f, document.getElementById(f).value.trim());
        });
        alert('Settings saved securely to your browser.');
    }

    function append(num) {
        const input = document.getElementById('number-input');
        input.value += num;
    }

    function backspace() {
        const input = document.getElementById('number-input');
        input.value = input.value.slice(0, -1);
    }

    function toggleConfig() {
        const config = document.getElementById('config');
        config.style.display = config.style.display === 'block' ? 'none' : 'block';
    }

    async function makeCall() {
        const sid = document.getElementById('sid').value.trim();
        const token = document.getElementById('token').value.trim();
        const twiml = document.getElementById('twimlurl').value.trim();
        const callerId = document.getElementById('callerid').value.trim();
        const to = document.getElementById('number-input').value.trim();
        const myNumber = document.getElementById('mynumber').value.trim();

        if (!sid || !token || !twiml || !callerId || !myNumber) {
            alert('Please configure all credentials and the TwiML URL in the settings panel.');
            return;
        }

        document.getElementById('status').innerText = "Connecting...";
        
        // This uses Twilio's Programmable Outbound Call API
        const url = `https://api.twilio.com/2010-04-01/Accounts/${sid}/Calls.json`;
        
        const auth = btoa(`${sid}:${token}`);
        
        const formData = new URLSearchParams();
        formData.append('Url', twiml); 
        formData.append('To', myNumber);
        formData.append('From', callerId);

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Basic ${auth}`,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });

            if (response.ok) {
                document.getElementById('status').innerText = "Ringing your phone...";
            } else {
                const err = await response.json();
                document.getElementById('status').innerText = "Error: " + err.message;
            }
        } catch (error) {
            document.getElementById('status').innerText = "Connection Failed";
        }
    }
</script>

</body>
</html>
